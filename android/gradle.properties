# Termux has plenty of RAM (15 GB) but Gradle's defaults assume a desktop; the
# heap is capped so a runaway daemon cannot take the phone down with it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Never let AGP fetch SDK components: the host binaries it would download are
# x86_64 and cannot execute here.
android.builder.sdkDownload=false

# Google only publishes aapt2 for x86_64 hosts; this points the build at the
# aarch64 build from the SDK tree instead of the Maven artifact.
android.aapt2FromMavenOverride=/data/data/com.termux/files/home/.android-sdk/build-tools/36.0.0/aapt2
