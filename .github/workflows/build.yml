name: Build & Push (slim)

# Slim single-user edition. Publishes only slim-suffixed image tags so it never
# collides with the full edition's `latest` / bare version tags built from main.
on:
  push:
    branches: [slim/single-user]
    tags: ['v*-slim']

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/tunnel-manager
  ACR_REGISTRY: crpi-2ulafqan571jasyp.cn-shanghai.personal.cr.aliyuncs.com
  ACR_IMAGE: crpi-2ulafqan571jasyp.cn-shanghai.personal.cr.aliyuncs.com/tunnel-manager/tunnel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 镜像列表：ghcr 永远推；若配了 ALIYUN_ACR_PASSWORD 则同时推一份到阿里云 ACR。
      # 注：secrets 不能在 if: 里直接用，故先在步骤里算出 acr=yes/no 再做条件
      - name: Compose image list
        id: images
        env:
          ACR_PW: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          IMAGES="${{ env.GHCR_IMAGE }}"
          if [ -n "$ACR_PW" ]; then
            echo 'acr=yes' >> "$GITHUB_OUTPUT"
            IMAGES="${IMAGES}"$'\n'"${{ env.ACR_IMAGE }}"
          else
            echo 'acr=no' >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'images<<GHCR_ACR_EOF'
            printf '%s\n' "$IMAGES"
            echo 'GHCR_ACR_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.images.outputs.acr == 'yes'
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.images }}
          # Slim tags only — no `latest`, no bare version numbers (those belong
          # to the full edition built from main and would collide here).
          tags: |
            # 推送到 slim 分支 -> :slim（相当于完整版的 latest）
            type=raw,value=slim,enable=${{ github.ref == 'refs/heads/slim/single-user' }}
            # 打 v*-slim 标签 -> 保留完整标签，例如 v2.6.0-slim
            type=ref,event=tag
            # 任意提交 -> 短哈希，便于回溯精确代码位置
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
