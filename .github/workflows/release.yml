name: Release binaries (slim)

# Slim single-user edition: only vX.Y.Z-slim tags. The release is marked as a
# pre-release so it never becomes the repository's `releases/latest`, which the
# full edition's in-panel update check reads.
on:
  push:
    tags: ['v*-slim']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android initial page loads
        run: node --test android/tools/first-load.test.mjs android/tools/slim-version.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --loglevel verbose
          npm test
          npm run build

      - name: Check release metadata and generated resources
        run: |
          node --test android/tools/release-version.test.mjs tools/slim-edition.test.mjs
          node tools/i18n/generate.mjs --check
          node android/tools/gen-tokens.mjs --check

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Test backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

      - name: Build backend binary (linux amd64)
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o ../tunnel-manager .

      - name: Package
        run: |
          DIR="tunnel-manager_${GITHUB_REF_NAME}_linux_amd64"
          mkdir -p "$DIR/frontend"
          mv tunnel-manager "$DIR/"
          cp -r frontend/dist "$DIR/frontend/dist"
          tar czf "${DIR}.tar.gz" "$DIR"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tunnel-manager_*.tar.gz
            tunnel-manager_*.tar.gz.sha256
          draft: true
          make_latest: false
          prerelease: true
