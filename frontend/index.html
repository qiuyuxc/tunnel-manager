<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/webp" href="/icon.webp" />
  <title>Cloudflare Tunnel Manager</title>
  <!-- Body and heading weights are on every screen; start them before the CSS parses. -->
  <link rel="preload" href="/fonts/misans-400-core.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/misans-600-core.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <script>
    (function () {
      var root = document.documentElement
      var visualTheme = localStorage.getItem('visual_theme')
      var darkMode = localStorage.getItem('dark_mode') === 'true'
      root.setAttribute('data-visual-theme', visualTheme === 'warm' ? 'warm' : 'enterprise')
      root.setAttribute('data-theme', darkMode ? 'dark' : '')
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
